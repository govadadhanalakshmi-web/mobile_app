appId: com.android.chrome
---
# 1. Close modal if left open
- tapOn:
    text: "Cancel"
    optional: true

# 2. Open Create Task modal
- tapOn: "+"
- assertVisible: "Create New Task"

# 3. Enter Task Title
- tapOn:
    point: "50%, 57%"
- inputText: "Maestro Verified Task"

# 4. Hide keyboard
- back

# 5. Save Task
- tapOn: "Create Task"

# 6. Verify task appears on home screen
- assertVisible: "Maestro Verified Task"

# 7. Test Filter tabs
- tapOn: "Pending"
- tapOn: "In Progress"
