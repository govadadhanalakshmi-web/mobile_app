version: 0.1

# AWS Device Farm Custom Test Environment Spec
# Target App: TodoMaster Release APK (Hermes AOT, Offline-First)
# Framework: Maestro E2E Cloud Automation

phases:
  install:
    commands:
      - echo "Installing Maestro CLI onto AWS Test Host..."
      - curl -fsSL "https://get.maestro.mobile.dev" | bash
      - export PATH="$PATH:$HOME/.maestro/bin"
      - maestro --version

  pre_test:
    commands:
      - echo "Installing TodoMaster-Release.apk on real AWS Android device..."
      - adb install -r -g $DEVICEFARM_APP_PATH

  test:
    commands:
      - echo "Starting Google Tasks Complete CRUD E2E Automated Flow..."
      - maestro test --format junit --output $DEVICEFARM_LOG_DIR/maestro-report.xml google-tasks-crud-e2e.yaml

  post_test:
    commands:
      - echo "Collecting Android OS Diagnostic Telemetry..."
      - adb shell dumpsys meminfo com.todomaster.app > $DEVICEFARM_LOG_DIR/meminfo.txt
      - adb shell dumpsys gfxinfo com.todomaster.app > $DEVICEFARM_LOG_DIR/gfxinfo.txt
      - adb shell dumpsys power > $DEVICEFARM_LOG_DIR/power.txt

artifacts:
  - $DEVICEFARM_LOG_DIR

